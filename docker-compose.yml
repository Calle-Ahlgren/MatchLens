services:
    postgres:
        image: postgres:16

        environment:
            POSTGRES_DB: matchlens
            POSTGRES_USER: matchlens
            POSTGRES_PASSWORD: matchlens_dev

        ports:
            - "127.0.0.1:5432:5432"

        volumes:
            - "./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro"
            - "./database/02-init-test-db.sql:/docker-entrypoint-initdb.d/02-init-test-db.sql:ro"
            - postgres_data:/var/lib/postgresql/data

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U matchlens -d matchlens"]

            interval: 3s
            timeout: 3s
            retries: 10
        
    backend:
        build: ./backend

        ports:
            - "127.0.0.1:8000:8000"

        environment:
            DATABASE_URL: postgresql://matchlens:matchlens_dev@postgres:5432/matchlens

        depends_on:
            postgres:
                condition: service_healthy

    frontend:
        build: "./frontend"

        ports:
            - "127.0.0.1:3000:80"

        depends_on:
            - backend

        
volumes:
  postgres_data: