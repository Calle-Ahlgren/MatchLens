services:
  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: matchlens
      POSTGRES_USER: matchlens
      POSTGRES_PASSWORD: matchlens_dev

    ports:
      - "5432:5432"

    volumes:
      - "./database/init.sql:/docker-entrypoint-initdb.d/init.sql"
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: